<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8C8D8"/>
      <stop offset="50%" stop-color="#F4B6C8"/>
      <stop offset="100%" stop-color="#EFAFC3"/>
    </linearGradient>

    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#d88fa8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>

  <!-- Soft abstract circles -->
  <circle cx="140" cy="70" r="120" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="1040" cy="250" r="150" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="980" cy="70" r="70" fill="#FFDCE7" opacity="0.18"/>

  <!-- Soft waves -->
  <path d="M0 240 Q180 180 360 225 T720 225 T1200 205 V320 H0 Z"
        fill="url(#wave)"/>

  <path d="M0 265 Q220 210 430 248 T860 245 T1200 230 V320 H0 Z"
        fill="#FFFFFF" opacity="0.16"/>

  <!-- Name -->
  <text x="600" y="125"
        text-anchor="middle"
        font-family="Trebuchet MS, Verdana, Arial Rounded MT Bold, Arial, sans-serif"
        font-size="60"
        font-weight="700"
        letter-spacing="9"
        fill="#FFFFFF"
        filter="url(#shadow)">
    YÜKSEL ÇOBAN
  </text>

  <!-- Small decorative lines -->
  <line x1="425" y1="158" x2="540" y2="158"
        stroke="#FFFFFF" stroke-width="1.6" opacity="0.75"/>

  <text x="600" y="164"
        text-anchor="middle"
        font-family="Trebuchet MS, Verdana, Arial, sans-serif"
        font-size="21"
        font-weight="700"
        fill="#FFFFFF"
        opacity="0.95">
    &lt;/&gt;
  </text>

  <line x1="660" y1="158" x2="775" y2="158"
        stroke="#FFFFFF" stroke-width="1.6" opacity="0.75"/>

  <!-- Subtitle -->
  <text x="600" y="205"
        text-anchor="middle"
        font-family="Trebuchet MS, Verdana, Arial, sans-serif"
        font-size="27"
        font-weight="600"
        letter-spacing="2"
        fill="#FFFFFF">
    Full-Stack Developer
  </text>

  <!-- Bottom soft text -->
  <text x="600" y="245"
        text-anchor="middle"
        font-family="Trebuchet MS, Verdana, Arial, sans-serif"
        font-size="15"
        font-weight="600"
        letter-spacing="4"
        fill="#FFF7FA"
        opacity="0.95">
    MODERN • SOFT • CLEAN
  </text>

</svg>
